# Offline CI: no API keys, no network for tests (the conftest blocks sockets), synthetic
# sample data only. Installs exactly the container's locked dependencies plus pytest.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04
    timeout-minutes: 20
    env:
      PHARMGUARD_RXNORM_API_ENABLED: "false"
      PHARMGUARD_FAERS_ENABLED: "false"
      PHARMGUARD_TRACING: "none"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0 (node24)
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-api.lock
          pip install pytest vermin "google-genai>=2.25"   # Gemini client tests; not in the API image
      - name: Python 3.11 compatibility
        run: vermin --no-tips -t=3.11- --violations src app scripts tests api
      - name: Ingest the synthetic sample
        run: python scripts/ingest_data.py --sample
      - name: Tests
        run: python -m pytest -q
      - name: Trajectory gate
        run: python scripts/eval_trajectory.py --fault-suite --seeded-bugs --min-invariant-pass 1.0 --output-dir /tmp/trajectory

  docker:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (node24)
      - name: Build the API image (not pushed)
        run: docker build -t pharmguard-api:ci .
      - name: Fails closed without data
        run: |
          docker run -d --name pg -p 7860:7860 pharmguard-api:ci
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:7860/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/health)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                 -d '{"drugs":["warfarin","aspirin"]}' http://127.0.0.1:7860/v1/check)" = "503"
          docker rm -f pg
